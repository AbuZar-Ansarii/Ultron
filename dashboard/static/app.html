<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ultron // Tactical Remote</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06070a;
      --surface: #0a0c13;
      --card-bg: rgba(13, 16, 26, 0.75);
      --border: rgba(255, 31, 67, 0.22);
      --border-bright: rgba(255, 31, 67, 0.65);
      --crimson: #ff1f43;
      --crimson-glow: rgba(255, 31, 67, 0.4);
      --crimson-dim: rgba(255, 31, 67, 0.12);
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.12);
      --green: #00ff88;
      --green-dim: rgba(0, 255, 136, 0.14);
      --text: #f0f4fc;
      --text-dim: #7a889b;
      --text-muted: #4e596b;
      --panel: #0f121d;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 31, 67, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.04) 0%, transparent 45%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── TOP HUD HEADER ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 14, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-emblem {
      color: var(--crimson);
      font-size: 14px;
      animation: emblemPulse 2.5s infinite ease-in-out;
      text-shadow: 0 0 10px var(--crimson);
    }
    .logo-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #ffffff;
    }
    .logo-title em {
      color: var(--crimson);
      font-style: normal;
    }
    .logo-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--crimson-dim);
      border: 1px solid var(--border);
      color: var(--crimson);
      font-family: ui-monospace, 'Courier New', monospace;
    }
    @keyframes emblemPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px var(--crimson)); }
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: ui-monospace, 'Courier New', monospace;
      transition: all 0.3s;
    }
    .status-pill.on {
      background: var(--green-dim);
      border-color: rgba(0, 255, 136, 0.35);
      color: var(--green);
    }
    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-pill.on .status-dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .spacer { flex: 1; }

    .sec-badge {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 7px;
      border-radius: 4px;
      font-family: ui-monospace, 'Courier New', monospace;
      display: none;
    }
    .sec-badge.on  {
      display: block;
      background: var(--green-dim);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: var(--green);
    }
    .sec-badge.off {
      display: block;
      background: rgba(255, 31, 67, 0.1);
      border: 1px solid var(--border);
      color: #ff647c;
    }

    .hud-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      font-size: 9px;
      font-family: ui-monospace, 'Courier New', monospace;
      padding: 4px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hud-toggle-btn:hover {
      color: #ffffff;
      border-color: var(--crimson);
    }

    /* ── HOLOGRAPHIC OCULAR CORE DECK ── */
    #hud-deck {
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(13, 16, 26, 0.92) 0%, rgba(7, 8, 14, 0.95) 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    #hud-deck.collapsed {
      display: none;
    }
    .telemetry-left, .telemetry-right {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      min-width: 80px;
    }
    .telemetry-right {
      text-align: right;
    }
    .tel-val {
      color: var(--text-dim);
    }
    .tel-hi {
      color: var(--crimson);
      font-weight: 700;
    }
    .tel-cyan {
      color: var(--cyan);
      font-weight: 700;
    }

    .holo-core-center {
      width: 66px;
      height: 66px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .holo-core-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .h-ring-out {
      transform-origin: center;
      animation: spinCW 16s linear infinite;
    }
    .h-ring-mid {
      transform-origin: center;
      animation: spinCCW 10s linear infinite;
    }
    .h-iris {
      transform-origin: center;
      animation: irisBreathing 2.4s ease-in-out infinite;
    }
    .holo-core-center.active .h-ring-out { animation-duration: 5s; }
    .holo-core-center.active .h-ring-mid { animation-duration: 3s; }
    .holo-core-center.active .h-iris {
      animation: irisRapid 0.8s ease-in-out infinite;
    }
    @keyframes spinCW { 100% { transform: rotate(360deg); } }
    @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
    @keyframes irisBreathing {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px var(--crimson)); opacity: 0.9; }
      50%      { transform: scale(1.18); filter: drop-shadow(0 0 9px var(--crimson)); opacity: 1; }
    }
    @keyframes irisRapid {
      0%, 100% { transform: scale(1.1); filter: drop-shadow(0 0 12px var(--crimson)); }
      50%      { transform: scale(1.35); filter: drop-shadow(0 0 18px #ff4d6d); }
    }

    /* ── QUICK ACTION MATRIX CAROUSEL ── */
    .quick-chips-tray {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(6, 7, 10, 0.9);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .quick-chips-tray::-webkit-scrollbar { display: none; }
    .action-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      font-family: ui-monospace, 'Courier New', monospace;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .action-chip:hover {
      background: var(--crimson-dim);
      border-color: var(--crimson);
      color: #ffffff;
    }
    .action-chip:active {
      transform: scale(0.96);
      border-color: var(--cyan);
    }
    .action-chip.priority {
      border-color: rgba(255, 31, 67, 0.45);
      color: #ffffff;
      background: rgba(255, 31, 67, 0.08);
    }

    /* ── MAIN DIRECTIVES FEED ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overscroll-behavior-y: contain;
      user-select: text;
      -webkit-user-select: text;
    }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 86%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.55;
      animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      word-break: break-word;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Ultron Directives */
    .msg-j {
      align-self: flex-start;
      background: rgba(255, 31, 67, 0.06);
      border: 1px solid rgba(255, 31, 67, 0.25);
      border-left: 3.5px solid var(--crimson);
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .msg-j .lbl {
      color: var(--crimson);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: ui-monospace, 'Courier New', monospace;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .msg-j .lbl::before {
      content: '◈';
      font-size: 10px;
    }

    /* User Commands */
    .msg-u {
      align-self: flex-end;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-right: 3.5px solid var(--cyan);
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .msg-u .lbl {
      color: var(--cyan);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: ui-monospace, 'Courier New', monospace;
      margin-bottom: 5px;
      text-align: right;
    }

    /* System Telemetry Logs */
    .msg-sys {
      align-self: center;
      font-size: 10px;
      color: var(--text-dim);
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      font-family: ui-monospace, 'Courier New', monospace;
      letter-spacing: 0.8px;
    }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-bottom-right-radius: 3px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 86%;
      animation: pop 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .fc-icon { font-size: 24px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  {
      font-size: 8.5px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: var(--crimson);
      font-family: ui-monospace, 'Courier New', monospace; margin-bottom: 3px;
    }
    .fc-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
    .fc-size { font-size: 10px; color: var(--text-dim); margin-top: 2px; font-family: ui-monospace, 'Courier New', monospace; }
    .fc-bar-wrap { height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--crimson); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; font-family: ui-monospace, 'Courier New', monospace; letter-spacing: 1px; color: var(--text-dim); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #ff4d6d; }
    .fc-dl {
      display: inline-block; margin-top: 5px; font-size: 10.5px;
      color: var(--cyan); text-decoration: none; font-weight: 700;
      font-family: ui-monospace, 'Courier New', monospace; letter-spacing: 0.5px;
    }
    .fc-dl:hover { opacity: 0.8; }

    /* ── TACTICAL FOOTER COMMAND DECK ── */
    footer {
      flex-shrink: 0;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(7, 8, 14, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 20;
    }
    #inp {
      flex: 1;
      padding: 12px 14px;
      background: rgba(13, 16, 26, 0.85);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    #inp:focus {
      border-color: var(--crimson);
      background: rgba(255, 31, 67, 0.04);
      box-shadow: 0 0 0 3px rgba(255, 31, 67, 0.15);
    }
    #inp::placeholder { color: var(--text-muted); }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: scale(0.96); }
    .btn-send {
      background: linear-gradient(135deg, #ff1f43 0%, #ba102d 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(255, 31, 67, 0.3);
    }
    .btn-send:hover { opacity: 0.9; }

    .btn-wake {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: none;
    }
    .btn-wake.show {
      display: flex;
      color: var(--green);
      border-color: rgba(0, 255, 136, 0.4);
      background: var(--green-dim);
    }

    .btn-attach {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 12px 13px;
      font-size: 16px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn-attach:hover {
      border-color: var(--crimson);
      color: var(--crimson);
    }
    .btn-attach:active { transform: scale(0.96); }

    /* ── TACTICAL CRIMSON MIC BUTTON ── */
    #mic-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--crimson);
      padding: 11px 13px;
      font-size: 17px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      position: relative;
    }
    #mic-btn:hover {
      border-color: var(--crimson);
      background: var(--crimson-dim);
    }
    #mic-btn:active { transform: scale(0.94); }
    #mic-btn.recording {
      background: #ff1f43;
      border-color: #ff1f43;
      color: #ffffff;
      animation: micSonar 1.2s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(255, 31, 67, 0.6);
    }
    @keyframes micSonar {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 31, 67, 0.5); }
      50%      { transform: scale(1.08); box-shadow: 0 0 25px rgba(255, 31, 67, 0.85); }
    }

    /* ── TOAST NOTIFICATION ── */
    #toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(13, 16, 26, 0.95);
      border: 1px solid var(--crimson);
      box-shadow: 0 4px 20px rgba(255, 31, 67, 0.35);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      font-family: ui-monospace, 'Courier New', monospace;
      padding: 6px 16px;
      border-radius: 99px;
      opacity: 0;
      transition: all 0.22s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>

  <!-- Top Header HUD -->
  <header>
    <div class="logo-box">
      <span class="logo-emblem">◈</span>
      <span class="logo-title"><em>U</em>LTRON</span>
      <span class="logo-tag">PRIME</span>
    </div>
    <div class="status-pill" id="pill"><span class="status-dot"></span><span id="st">CONNECTING</span></div>
    <div class="sec-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <button class="hud-toggle-btn" id="hud-btn" onclick="toggleHud()" title="Toggle Telemetry Deck">HUD</button>
  </header>

  <!-- Holographic Ocular Core & Telemetry Deck -->
  <section id="hud-deck">
    <div class="telemetry-left">
      <div>SYS: <span class="tel-hi">OVERCLOCK</span></div>
      <div>CORE: <span class="tel-val">01 // PRIME</span></div>
      <div>RADAR: <span class="tel-cyan">ONLINE</span></div>
    </div>

    <div class="holo-core-center" id="holo-core" onclick="onCoreTap()" title="Ultron Cognition Core">
      <svg class="holo-core-svg" viewBox="0 0 100 100">
        <!-- Outer Azimuth Segmented Ring -->
        <circle class="h-ring-out" cx="50" cy="50" r="44" fill="none"
                stroke="rgba(255,31,67,0.35)" stroke-width="1.8"
                stroke-dasharray="16 8 4 8" />
        <!-- Middle Counter-Rotating Cyan Tick Ring -->
        <circle class="h-ring-mid" cx="50" cy="50" r="33" fill="none"
                stroke="rgba(0,240,255,0.4)" stroke-width="1.2"
                stroke-dasharray="8 6" />
        <!-- Core Chamber Background -->
        <circle cx="50" cy="50" r="21" fill="rgba(10,12,20,0.85)"
                stroke="#ff1f43" stroke-width="2" />
        <!-- Pulsing Crimson Ocular Iris -->
        <circle class="h-iris" cx="50" cy="50" r="10" fill="#ff1f43" />
        <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
      </svg>
    </div>

    <div class="telemetry-right">
      <div>SEC: <span class="tel-hi">LVL-05</span></div>
      <div>FPS: <span class="tel-cyan">60.0</span></div>
      <div>PORT: <span class="tel-val">__PORT__</span></div>
    </div>
  </section>

  <!-- Workspace Action Matrix Carousel -->
  <nav class="quick-chips-tray">
    <button class="action-chip priority" onclick="sendQuick('Ultron, aaj mere coding ka man hai')">💻 Coding Matrix</button>
    <button class="action-chip" onclick="sendQuick('Ultron, gaming mode on karo')">🎮 Gaming Mode</button>
    <button class="action-chip" onclick="sendQuick('Ultron, cyber security audit mode')">🛡️ Cyber Audit</button>
    <button class="action-chip" onclick="sendQuick('Ultron, aaj padhai karni hai')">📚 Study Mode</button>
    <button class="action-chip" onclick="sendQuick('Ultron, chill mode / movie dekhni hai')">🎬 Chill Mode</button>
    <button class="action-chip" onclick="sendQuick('Ultron, lock workstation')">🔒 Lock PC</button>
    <button class="action-chip" onclick="sendQuick('Ultron, system status')">⚡ Status Audit</button>
    <button class="action-chip" onclick="sendQuick('Ultron, mute audio')">🔇 Mute</button>
    <button class="action-chip" onclick="sendQuick('Ultron, set volume to 100%')">🔊 Vol 100%</button>
  </nav>

  <!-- Directives Chat Stream -->
  <main id="feed"></main>

  <!-- Tactical Bottom Command Footer -->
  <footer>
    <label class="btn-attach" for="file-inp" title="Send file to PC">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <input id="inp" placeholder="Command Ultron workstation…" autocomplete="off">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth Tokens ───────────────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('ultron_token') || sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('ultron_key') || sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC Encryption ───────────────────────────────────────────────
    const _AES_SALT = 'ULTRON-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'sec-badge on'; encBadge.textContent = 'AES-256'; }
    else           { encBadge.className = 'sec-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket Uplink ──────────────────────────────────────────────────────
    const feed      = document.getElementById('feed');
    const pill      = document.getElementById('pill');
    const stTxt     = document.getElementById('st');
    const wake      = document.getElementById('wake');
    const holoCore  = document.getElementById('holo-core');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => {
      sys('NEURAL UPLINK SYNCHRONIZED — AES-256 ACTIVE');
      toast('Uplink Synchronized');
      holoCore.classList.remove('active');
    };
    ws.onclose   = () => {
      sys('UPLINK SEVERED — REFRESH TO RE-ESTABLISH');
      setStatus('inactive');
    };
    ws.onerror   = () => sys('UPLINK NETWORK ERROR');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('WAKE EVENT DETECTED // INITIALIZING…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'status-pill on'; stTxt.textContent = 'ONLINE'; wake.classList.remove('show');
        holoCore.classList.add('active');
      } else {
        pill.className = 'status-pill'; stTxt.textContent = 'STANDBY'; wake.classList.add('show');
        holoCore.classList.remove('active');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      const isUltron = (speaker === 'ultron' || speaker === 'jarvis');
      if (isUltron) {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">ULTRON PRIME</div>${esc(text)}`;
        holoPulse();
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">COMMANDER</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = `[SYS] ${text}`;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function holoPulse() {
      holoCore.classList.add('active');
      setTimeout(() => holoCore.classList.remove('active'), 2500);
    }

    function onCoreTap() {
      if (navigator.vibrate) navigator.vibrate(20);
      doWake();
      toast('Ping Transmitted to Ultron');
    }

    function toggleHud() {
      const deck = document.getElementById('hud-deck');
      const btn  = document.getElementById('hud-btn');
      deck.classList.toggle('collapsed');
      btn.style.borderColor = deck.classList.contains('collapsed') ? 'var(--border)' : 'var(--crimson)';
    }

    // ── Quick Command Action Chips ───────────────────────────────────────────
    function sendQuick(cmd) {
      if (navigator.vibrate) navigator.vibrate([15, 30]);
      append('user', cmd);
      const enc  = _encrypt(cmd);
      const body = enc ? { enc } : { text: cmd };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      toast(`Sent: ${cmd.slice(0, 24)}…`);
    }

    // ── File Transfer ─────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm'].includes(ext))               return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg'].includes(ext))        return '🎵';
      if (['pdf'].includes(ext))                                       return '📋';
      if (['doc','docx','txt','md','rtf'].includes(ext))               return '📝';
      if (['zip','rar','7z','tar','gz'].includes(ext))                 return '📦';
      if (['py','js','html','css','json','c','cpp'].includes(ext))     return '💻';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">TRANSMITTING TO WORKSTATION</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'STORED IN ULTRON UPLOADS';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File Transferred to Ultron');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#ff4d6d';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">RECEIVED ON WORKSTATION</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('Workstation received file');
    }

    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = '';
    });

    // ── Command Input Handling ────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('TRANSMITTING WAKE SIGNAL…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast Notification ────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ── Real-Time Voice Streaming ─────────────────────────────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
      holoCore.classList.remove('active');
    }

    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return;
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(255,31,67,0.06)',
        'border:1px solid rgba(255,31,67,0.3)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:12px', 'line-height:1.75',
        'animation:pop 0.2s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:800;color:#ff1f43;letter-spacing:1px;margin-bottom:8px;font-family:monospace">🎤 ONE-TIME MOBILE MIC CONFIG</div>' +
        '<ol style="padding-left:18px;color:#9aa8c0;margin:0;display:flex;flex-direction:column;gap:5px">' +
        '<li>Open a new tab → navigate to <span style="background:rgba(255,255,255,0.07);padding:2px 6px;border-radius:4px;font-family:monospace;color:#ffffff">chrome://flags</span></li>' +
        '<li>Search for: <strong style="color:#ffffff">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this workstation URL:<br><span id="flags-url" style="background:rgba(255,31,67,0.12);border:1px solid rgba(255,31,67,0.3);color:#ff1f43;padding:3px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer;display:inline-block;margin-top:3px">' + esc(origin) + '</span></li>' +
        '<li>Set dropdown to <strong style="color:#00ff88">Enabled</strong> → tap <strong style="color:#ffffff">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤 to transmit voice.</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar settings to allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        if (navigator.vibrate) navigator.vibrate(30);
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop streaming';
        micBtn.classList.add('recording');
        holoCore.classList.add('active');
        sys('LIVE VOICE TRANSMISSION ACTIVE — SPEAK DIRECTIVES');
        toast('🎤 Transmitting Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('VOICE UPLINK FAILED'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (navigator.vibrate) navigator.vibrate(20);
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
